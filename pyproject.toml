[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "infapla"
version = "0.1.0"
description = "InFaPla - Intelligent Family Planner"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=2.0",
]

[project.scripts]
infapla = "infapla.cli:main"

[tool.setuptools]
packages = ["infapla", "infapla.parsers"]

[tool.setuptools.package-data]
infapla = ["templates/*", "static/css/*", "static/js/*"]
